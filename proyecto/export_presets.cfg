[preset.0]
name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json,VERSION.json,challenge_decks.json,imagenes/*,assets/*,audio/*"
exclude_filter="tests/*,tools/*,backend/*,documentacion/*"
export_path="../build/web/index.html"
script_export_mode=2

[preset.0.options]
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=false
vram_texture_compression/for_mobile=false
html/custom_html_shell="res://web/shell.html"
html/head_include=""
html/canvas_resize_policy=0
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=true
progressive_web_app/enabled=false

[preset.1]
name="Windows Desktop"
platform="Windows Desktop"
runnable=false
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json,VERSION.json,challenge_decks.json,imagenes/*,assets/*,audio/*"
exclude_filter="tests/*,tools/*,backend/*,documentacion/*,web/*"
export_path="../build/windows/AAMIX.exe"
script_export_mode=2

[preset.1.options]
binary_format/architecture="x86_64"
binary_format/embed_pck=false
application/icon="res://assets/aamix_a_white.ico"
